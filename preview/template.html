<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elvis · The Prime Years</title>
<style>
  :root { color-scheme: dark; font: 15px/1.5 system-ui,sans-serif; background:#0a0c10; color:#ede5d9 }
  * { box-sizing:border-box }
  body { margin:0; padding:36px 5vw 48px }
  main { max-width:1160px; margin:auto }
  header { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:24px }
  h1 { font:400 clamp(28px,4vw,48px)/1.1 Georgia,serif; margin:8px 0 0 }
  .eyebrow { font-size:10px; letter-spacing:.25em; text-transform:uppercase; color:#b8a184 }
  .order { color:#aaa49c; font-size:13px }
  #stage { height:min(64vh,640px); min-height:330px; position:relative; overflow:hidden; background:#080a0e; border:1px solid #25272c; border-radius:6px }
  #stage .portrait { position:absolute; height:84%; width:80%; left:10%; top:8%; filter:drop-shadow(0 0 4px #ffe1a947); opacity:0 }
  .portrait path { fill:none; stroke:var(--ink,#fff0d5); stroke-linecap:round; stroke-linejoin:round }
  #stage-label { position:absolute; left:24px; bottom:18px; color:#797c82; font-size:11px; letter-spacing:.12em }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:14px; padding:18px 0 26px }
  button,select { font:inherit; border:1px solid #3b3c3f; border-radius:5px; padding:9px 17px; color:inherit; background:#15171c; cursor:pointer }
  button:hover,select:hover { border-color:#c9ad86 }
  button:focus-visible,select:focus-visible,input:focus-visible { outline:2px solid #e5bf83; outline-offset:4px }
  #play { background:#ead6b8; color:#171410; border-color:#ead6b8; min-width:132px }
  label { color:#aaa49c; font-size:13px }
  .color { display:flex; gap:8px; align-items:center; margin-left:auto }
  input[type=color] { height:32px; width:38px; padding:2px; border:1px solid #3b3c3f; background:none; cursor:pointer }
  .stills { display:grid; grid-template-columns:repeat(3,1fr); gap:16px }
  .still { text-align:left; display:flex; flex-direction:column; padding:18px; background:#0d0f14; border-color:#25272c }
  .still svg { width:100%; height:220px; margin-bottom:18px }
  .still span { color:#a29b90; font-size:12px }
  .still strong { display:block; font-weight:450; color:#eee4d5; font-size:14px }
  footer { margin-top:20px; color:#787c83; font-size:12px }
  @media(max-width:620px) { body{padding:22px 16px} header{display:block} .order{margin-top:14px} .still{padding:10px} .still svg{height:140px} .stills{gap:8px} .color{margin-left:0} }
</style>
<main>
  <header><div><div class="eyebrow">An Omarchy unlock sequence</div><h1>Elvis. The prime years.</h1></div><div class="order">Photo 3 &nbsp;→&nbsp; Photo 2 &nbsp;→&nbsp; Photo 1</div></header>
  <div id="stage" role="img" aria-label="Animated Elvis outlines, from the stage pose through the microphone portrait to the profile"><span id="stage-label">READY TO PLAY</span></div>
  <div class="controls">
    <button id="play" type="button">Play sequence</button>
    <label for="pace">Each portrait</label>
    <select id="pace"><option value="1000">1 second</option><option value="1500">1.5 seconds</option><option value="2000">2 seconds</option></select>
    <label class="color" for="ink">Line color <input id="ink" type="color" value="#fff0d5"></label>
  </div>
  <div id="stills" class="stills" aria-label="Inspect each finished vector portrait"></div>
  <footer>Traced from your three photographs. Select a portrait to inspect it; play to see the chronological sequence.</footer>
</main>
<script>
const portraits = __PORTRAITS__;
const ns='http://www.w3.org/2000/svg';
const stage=document.getElementById('stage'), label=document.getElementById('stage-label');
const descriptions=['The stage pose','The microphone portrait','The profile'];
let raf=0, running=false;
function makeSvg(p, animated=false) {
  const svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox',p.viewBox.join(' '));
  svg.setAttribute('class','portrait');
  const title=document.createElementNS(ns,'title'); title.textContent='Elvis, photo '+p.number; svg.append(title);
  const paths=p.strokes.map(s=>{
    const path=document.createElementNS(ns,'path');
    path.setAttribute('d',s.d); path.setAttribute('stroke-width',s.width*1.2);
    svg.append(path); return {path,s,length:0};
  });
  if(animated) stage.append(svg);
  return {svg,paths};
}
const frames=portraits.map(p=>makeSvg(p,true));
frames.forEach(f=>f.paths.forEach(p=>{p.length=p.path.getTotalLength();p.path.style.strokeDasharray=p.length+' '+p.length}));
function clamp(n) { return Math.max(0,Math.min(1,n)); }
function at(ms,slot) {
  frames.forEach((f,i)=>{
    const local=ms-i*slot;
    const alpha=clamp(local/70)*(i<2?clamp((slot+110-local)/140):clamp((slot*3+350-ms)/350));
    f.svg.style.opacity=alpha;
    if(alpha>0) f.paths.forEach(p=>p.path.style.strokeDashoffset=p.length*(1-clamp((local/slot-p.s.delay)/p.s.duration)));
  });
}
function stop() { cancelAnimationFrame(raf); running=false; document.getElementById('play').textContent='Replay sequence'; }
function still(i) {
  stop(); frames.forEach((f,j)=>{f.svg.style.opacity=i===j?1:0;f.paths.forEach(p=>p.path.style.strokeDashoffset=0)});
  label.textContent='PHOTO '+portraits[i].number+' / '+descriptions[i].toUpperCase();
}
function play() {
  stop(); running=true; document.getElementById('play').textContent='Replay sequence';
  const slot=Number(document.getElementById('pace').value), start=performance.now();
  label.textContent='';
  function tick(now) {
    const t=Math.min(now-start,slot*3+350); at(t,slot);
    if(t<slot*3+350) raf=requestAnimationFrame(tick); else {running=false;label.textContent='SEQUENCE COMPLETE'}
  }
  raf=requestAnimationFrame(tick);
}
portraits.forEach((p,i)=>{
  const button=document.createElement('button'); button.className='still'; button.type='button';
  button.append(makeSvg(p).svg);
  const info=document.createElement('span'); info.textContent='PHOTO '+p.number;
  const name=document.createElement('strong'); name.textContent=descriptions[i]; info.append(name); button.append(info);
  button.addEventListener('click',()=>still(i)); document.getElementById('stills').append(button);
});
document.getElementById('play').addEventListener('click',play);
document.getElementById('ink').addEventListener('input',e=>document.documentElement.style.setProperty('--ink',e.target.value));
document.getElementById('pace').addEventListener('change',()=>{if(running) play()});
still(0);
</script>
</html>
